name: Android release

# Builds a signed universal APK. Push a `v*` tag (or run the workflow manually)
# and the APK is attached to the GitHub Release.
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64    base64 of the release .jks
#   ANDROID_KEYSTORE_PASSWORD  store password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
# Optional (build-time configuration, all publishable):
#   SUPABASE_URL, SUPABASE_ANON_KEY, STUN_URL,
#   TURN_URL, TURN_USERNAME, TURN_CREDENTIAL
#
# Never add the service_role key, the FCM service account or a TURN secret here.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the APK to (e.g. v1.0.0)'
        required: false

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret for $name. See the workflow header."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STUN_URL: ${{ secrets.STUN_URL }}
          TURN_URL: ${{ secrets.TURN_URL }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
        run: |
          set -euo pipefail
          args=(--release --obfuscate --split-debug-info=build/symbols)
          add() { if [ -n "$2" ]; then args+=("--dart-define=$1=$2"); fi; }
          add SUPABASE_URL "$SUPABASE_URL"
          add SUPABASE_ANON_KEY "$SUPABASE_ANON_KEY"
          add STUN_URL "$STUN_URL"
          add TURN_URL "$TURN_URL"
          add TURN_USERNAME "$TURN_USERNAME"
          add TURN_CREDENTIAL "$TURN_CREDENTIAL"
          flutter build apk "${args[@]}"

      - name: Rename artifact
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then
            version="$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/adoetz-chat-${version}.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: adoetz-chat-apk
          path: dist/*
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: adoetz-chat-symbols
          path: build/symbols/*
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Adoetz Chat ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks dist/*.apk
