name: adoetz_chat
description: "Adoetz Chat - private end-to-end encrypted messenger."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.8.4
  flutter_secure_storage: ^9.2.4
  sqflite_sqlcipher: ^3.4.1
  path: ^1.9.1
  path_provider: ^2.1.5

  # Cryptography
  libsignal_protocol_dart: ^0.8.2
  cryptography: ^2.7.0
  crypto: ^3.0.6

  # Calling & realtime
  flutter_webrtc: ^1.6.3
  flutter_callkit_incoming: ^2.5.2
  connectivity_plus: ^6.1.3

  # Notifications
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1

  # Media & files
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  record: ^7.1.2
  just_audio: ^0.9.46
  open_filex: ^4.7.0
  mime: ^2.0.0

  # Platform & preferences
  permission_handler: ^11.3.1
  local_auth: ^2.3.0
  shared_preferences: ^2.5.3
  package_info_plus: ^8.3.0
  device_info_plus: ^11.3.0
  uuid: ^4.5.1
  intl: ^0.20.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
